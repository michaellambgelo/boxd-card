name: PR Checks

on:
  pull_request:
    branches:
      # `main` is where development actually merges — it previously had no test
      # or build gate at all, so a break only surfaced at the main → release
      # promotion, several PRs deep.
      - main
      - release

jobs:
  version-check:
    name: Version Check
    # Only meaningful for release PRs; main PRs don't carry a version bump.
    if: github.base_ref == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version is not already tagged
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG does not exist yet — clear to release."
            exit 0
          fi
          # Tag exists. Allow this PR if the tagged commit is reachable from
          # HEAD — that means we're only syncing the release branch up to a
          # commit that was already released, not trying to ship new content
          # under an already-released version.
          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "Tag $TAG already exists and is reachable from HEAD — syncing only, no new version required."
            exit 0
          fi
          echo "ERROR: Tag $TAG exists but points outside the current history. Bump the version in package.json and manifest.json before opening a release PR."
          exit 1

  # Are macOS-baked goldens reproducible on Linux?
  #
  # The visual suite skips under CI because goldens are baked on Michael's Mac
  # and freetype on ubuntu-latest can hint and antialias differently. Embedding
  # Inter removed the original cause — a generic `sans-serif` resolving through
  # fontconfig rather than CoreText — so the remaining question is purely
  # empirical, and the only way to answer it is to actually run them here.
  #
  # This job MEASURES; it does not gate. Goldens are expected to differ here, so
  # a mismatch must not surface as a failed check: a red X on the PR reads as
  # "something is broken" and, worse, says nothing about the size of the
  # difference. The numbers go to the job summary instead, where they are useful.
  #
  # Note the granularity: only the golden comparison is tolerated. If npm ci or
  # the node-canvas build fails, this job still goes red, because that IS broken.
  #
  # If the measured difference ever drops well below the size of a real
  # regression, SKIP_IN_CI in test/visual/goldens.visual.test.ts can be dropped
  # and this promoted into a genuine gate.
  golden-portability:
    name: Golden portability (measurement)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Measure goldens against Linux rasterization
        env:
          RUN_VISUAL_IN_CI: '1'
        run: |
          # Deliberately tolerated: a golden mismatch here is the measurement,
          # not a failure. Infrastructure problems in the steps above still fail.
          npx vitest run --project visual > /tmp/visual.log 2>&1 || true
          cat /tmp/visual.log
          node .github/scripts/summarize-goldens.mjs /tmp/visual.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diffs
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-linux
          path: studio-out/golden-failures/
          if-no-files-found: ignore

  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Build extension
        run: npm run build

      # Verifies the web app still compiles. Deliberately not compared against
      # the committed docs/app/: the Faro rollup plugin injects a fresh bundle
      # id on every build, so the output hash never matches byte-for-byte and
      # such a check would be permanently red. Keeping docs/app/ in sync is the
      # .githooks/pre-commit hook's job.
      - name: Build web app
        run: npm run build:web

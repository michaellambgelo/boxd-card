name = "boxd-card"
main = "index.ts"
compatibility_date = "2024-09-23"

# ── Rate limiting ───────────────────────────────────────────────────────────
# The proxy is unauthenticated and open to anyone. Abuse doesn't just cost
# Workers requests — every proxied call hits Letterboxd from a Cloudflare IP
# under our User-Agent, so sustained abuse risks Letterboxd blocking the
# traffic and taking the product down with it.
#
# ⚠️ MEASURED, NOT ASSUMED: this binding counts PER ISOLATE, not globally.
# 695 requests against a single fixed key returned success:true every time,
# because they spread across isolates and no individual counter approached the
# limit. Treat it as a brake on one hot isolate, NOT as a global cap.
#
# The real control is a Cloudflare dashboard rate-limiting rule on
# api.boxd-card.com, which is enforced at the edge per zone. That is still
# worth adding; this binding does not replace it.
#
# Sizing note: the limit is on SUBREQUESTS, not "cards per minute". One 20-film
# list card with TMDB costs ~63 proxy requests — 1 page + 20 /tmdb + 20 posters
# + 20 CDN-URL resolutions (/film/<slug>/image-NNN/ is HTML, so each poster
# needs a second fetch to read the real URL from JSON-LD) + backdrop + avatar.
# 600/min per isolate leaves a person iterating on layouts far clear of it.
#
# isRateLimited() in index.ts fails open if the binding is ever removed.

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# To deploy:
#   npx wrangler deploy
#
# Secrets (set once per environment):
#   npx wrangler secret put TMDB_API_KEY
#     Required by the /tmdb route. Without it, /tmdb returns 503. The value
#     is a TMDB v4 "API Read Access Token" (Bearer token), NOT the v3 API Key.
#     Sent as `Authorization: Bearer <token>` so the key never appears in URLs.
#
# To run locally (for dev:web):
#   npx wrangler dev --port 8787
#     For local TMDB dev, add TMDB_API_KEY=... to .dev.vars (gitignored).
#
# After deploying, set the worker URL in .env.local:
#   VITE_PROXY_URL=https://boxd-card-proxy.<account>.workers.dev
#
# Or add a custom domain via the Cloudflare dashboard and use that instead,
# e.g. VITE_PROXY_URL=https://api.boxd-card.com
